media: public/static
content:
  - name: microblog
    label: Microblogs
    type: collection
    path: src/content/microblogs
    filename: "mpost-{month}-{day}-{year}.md"
    commit:
      templates:
        create: "📑 content(create): New microblog -> {filename}"
        update: "📑 content(update): Update microblog #({filename})"
        delete: "📑 content(delete): Deleted microblog -> #({filename})"
        rename: "📑 content(rename): Renamed microblog {oldFilename} -> {newFilename}"
    fields:
      - name: body
        label: Content
        type: rich-text
        required: true
        
      - name: date
        label: Date Published
        type: date
        default: ""
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssXXX
        
      - name: updatedDate
        label: Edited Date
        type: date
        default: ""
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssXXX
        
      - name: tags
        label: Tags
        type: string
        list: true
        
      - name: pinned
        label: Is post pinned?
        type: boolean